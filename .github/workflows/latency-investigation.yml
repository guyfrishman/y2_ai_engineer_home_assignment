name: Latency investigation - native Linux loadtest

# Manual-only diagnostic tool, not a CI gate: converts "probably the Windows
# Docker Desktop networking layer" (docs/infrastructure/latency-investigation.md)
# from a guess into a measured cross-environment comparison, by running the
# exact same reproducer scenario on a native-Linux GitHub-hosted runner
# instead of a Windows/WSL2 development machine.
#
# Needs a real OPENAI_API_KEY repository secret to be informative. Without
# one, LLM-path queries resolve via the fast api_error -> degrade path
# instead of a real slow model call, so the degraded scenario this
# investigation is about never actually gets triggered -- the run will just
# show an already-known "fast everywhere" result, not a real comparison.
on:
  workflow_dispatch:

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync api dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Configure OPENAI_API_KEY (optional)
        working-directory: api
        run: |
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          else
            echo "::warning::No OPENAI_API_KEY secret configured -- LLM-path requests will resolve via the fast api_error->degrade path, not a real model call. This run only shows the pure cache/rules baseline (already known fast everywhere), not the actual degraded scenario this investigation is about."
          fi

      - name: Build and start the service
        run: docker compose up --build -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::service never became healthy"
          docker compose logs
          exit 1

      - name: Standard reproducer loadtest (concurrency=20, llm-ratio=0.10)
        working-directory: api
        run: uv run python ../scripts/loadtest.py --requests 150 --concurrency 20 --llm-ratio 0.10

      - name: Pure cache/rules baseline (llm-ratio=0.0, for comparison)
        working-directory: api
        run: uv run python ../scripts/loadtest.py --requests 150 --concurrency 20 --llm-ratio 0.0

      - name: Tear down
        if: always()
        run: docker compose down
