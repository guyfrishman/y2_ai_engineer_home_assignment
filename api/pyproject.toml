[project]
name = "yad2-search-api"
version = "0.1.0"
description = "Hebrew free-text search-understanding service for Yad2 (rule-first, LLM-fallback pipeline)"
authors = [
    { name = "Guy Frishman" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "cachetools>=5.5.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
